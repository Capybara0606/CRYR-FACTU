name: Publicar aplicación
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm test
      - name: Preparar sitio
        run: |
          mkdir _site
          cp index.html app.js domain.js invoice-export.js history-import.js cloud-store.js cloud-auth.js firebase-config.js style.css CLOUD_SETUP.md _site/
          cp -R assets _site/assets
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        id: pages-artifact
        with:
          path: _site
      - name: Verificar artefacto
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: test -n "$PAGES_ARTIFACT_ID"
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
